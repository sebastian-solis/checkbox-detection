name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile every module
        # Catches semantic syntax errors that a linter walks past.
        run: python -m compileall -q app eval tools tests

      - name: Lint
        run: ruff check app eval tools tests

      - name: Tests
        run: pytest -q

      - name: Detection quality
        # The harness scores against hand-checked ground truth and exits non-zero
        # if no document has been reviewed. Wiring it in here is what stops a
        # threshold change that helps one page and quietly ruins another.
        run: python eval/evaluate.py --verbose

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t checkbox-detection:ci .

      # Scan the built image for known CVEs before it can be shipped. This is
      # the supply-chain leg of the security posture argued in WRITEUP.md:
      # pinned dependencies stop a base image from silently changing, and
      # scanning catches a pinned dependency that was safe last week and is
      # not any more.
      # Software Bill of Materials, the other leg of the supply chain story
      # from Trivy's vulnerability scan. Trivy answers "which of what we ship
      # has known CVEs"; the SBOM answers "what is in what we ship, so an
      # audit can check it later without rebuilding". Uploading it as an
      # artifact keeps a machine-readable inventory next to every commit.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: checkbox-detection:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Scan image with Trivy (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: checkbox-detection:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Run it and check the contract
        run: |
          docker run -d --name svc -p 8000:8000 checkbox-detection:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break || sleep 2
          done

          # Contract check against a real sample
          curl -fsS -X POST http://localhost:8000/detect \
            -F "file=@samples/uniform_residential_appraisal.png" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert set(d)=={'boxes'}; assert d['boxes']; print(f\"contract ok, {len(d['boxes'])} boxes\")"

          # Security headers must be present on the live response, not just
          # in unit tests: a middleware ordering mistake would let unit tests
          # pass and production ship bare.
          curl -fsS -D headers.txt -o /dev/null http://localhost:8000/health
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          echo "security headers verified on live response"

          docker rm -f svc
